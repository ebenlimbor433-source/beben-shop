<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BEBEN — Smart Shopping</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23D4AF37'/><text y='.9em' font-size='80' font-family='sans-serif' font-weight='900' fill='%230A0A0F'>B</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#0A0A0F;color:#fff;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#D4AF37;border-radius:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.pc{transition:all .3s ease}.pc:hover{transform:translateY(-6px);box-shadow:0 20px 60px rgba(212,175,55,.15)}
.btn-gold{background:linear-gradient(135deg,#D4AF37,#F5C842);color:#0A0A0F;font-weight:700;border:none;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(212,175,55,.4)}
.cat-btn{cursor:pointer;transition:all .2s;border:1.5px solid #222;background:#0F0F1A;color:#666;font-family:'DM Sans',sans-serif}
.cat-btn.active{border-color:#D4AF37;background:rgba(212,175,55,.1);color:#D4AF37}
.cat-btn:hover{border-color:#D4AF37}
.nav-lnk{color:#888;transition:color .2s;cursor:pointer}.nav-lnk:hover{color:#D4AF37}
.tab-btn{cursor:pointer;transition:all .2s;padding:8px 16px;border-radius:8px;font-size:14px;border:none;font-family:'DM Sans',sans-serif}
.tab-btn.active{background:rgba(212,175,55,.15);color:#D4AF37}
.tab-btn:not(.active){color:#666;background:transparent}
.sort-sel{background:#111;border:1px solid #222;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif}
.sort-sel option{background:#111}
.fd{background:linear-gradient(90deg,#D4AF37,#F5C842);border-radius:2px;height:6px;transition:width .6s ease}
.hd{width:8px;height:8px;border-radius:50%;cursor:pointer;transition:all .3s;background:#444;border:none}
.hd.active{background:#D4AF37;width:24px;border-radius:4px}
.tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
input{outline:none;font-family:'DM Sans',sans-serif}
select{outline:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

const PRODUCTS=[
  {id:1,name:"Sneaker Air Nova Pro",category:"fashion",price:899000,originalPrice:1299000,rating:4.8,reviews:2341,image:"👟",trending:true,hot:true,stock:15,sold:892,tags:["bestseller","trending"],priceHistory:[1299000,1199000,999000,899000],brand:"NovaTech"},
  {id:2,name:"Wireless Earbuds X12",category:"elektronik",price:459000,originalPrice:699000,rating:4.7,reviews:1876,image:"🎧",trending:true,hot:false,stock:43,sold:2341,tags:["trending","flash"],priceHistory:[699000,649000,549000,459000],brand:"SoundPro"},
  {id:3,name:"Tote Bag Canvas Premium",category:"fashion",price:279000,originalPrice:399000,rating:4.6,reviews:987,image:"👜",trending:false,hot:true,stock:8,sold:445,tags:["hot","limited"],priceHistory:[399000,379000,319000,279000],brand:"UrbanStyle"},
  {id:4,name:"Smart Watch Series 9",category:"elektronik",price:1299000,originalPrice:1899000,rating:4.9,reviews:3210,image:"⌚",trending:true,hot:true,stock:22,sold:1203,tags:["bestseller","trending","hot"],priceHistory:[1899000,1699000,1499000,1299000],brand:"TechPulse"},
  {id:5,name:"Krim Wajah Hyaluron 50ml",category:"kecantikan",price:189000,originalPrice:259000,rating:4.5,reviews:4521,image:"💄",trending:true,hot:false,stock:67,sold:5672,tags:["bestseller"],priceHistory:[259000,239000,219000,189000],brand:"GlowLab"},
  {id:6,name:"Blender Portable Mini",category:"rumah",price:249000,originalPrice:349000,rating:4.4,reviews:1234,image:"🥤",trending:false,hot:true,stock:31,sold:789,tags:["hot"],priceHistory:[349000,329000,289000,249000],brand:"KitchenPro"},
  {id:7,name:"Sepatu Running Elite",category:"fashion",price:749000,originalPrice:999000,rating:4.7,reviews:1567,image:"👞",trending:true,hot:false,stock:19,sold:1023,tags:["trending"],priceHistory:[999000,899000,799000,749000],brand:"SpeedFit"},
  {id:8,name:"Laptop Stand Aluminium",category:"elektronik",price:329000,originalPrice:459000,rating:4.6,reviews:892,image:"💻",trending:false,hot:false,stock:54,sold:432,tags:[],priceHistory:[459000,429000,379000,329000],brand:"DeskMate"},
  {id:9,name:"Vitamin C Serum 30ml",category:"kecantikan",price:149000,originalPrice:219000,rating:4.8,reviews:6789,image:"✨",trending:true,hot:true,stock:102,sold:8901,tags:["bestseller","trending","hot"],priceHistory:[219000,199000,169000,149000],brand:"GlowLab"},
  {id:10,name:"Headphone Studio Pro",category:"elektronik",price:879000,originalPrice:1199000,rating:4.8,reviews:2109,image:"🎵",trending:true,hot:false,stock:12,sold:672,tags:["trending"],priceHistory:[1199000,1099000,979000,879000],brand:"SoundPro"},
  {id:11,name:"Seprai Anti-Allergen",category:"rumah",price:199000,originalPrice:289000,rating:4.3,reviews:543,image:"🛏️",trending:false,hot:false,stock:78,sold:234,tags:[],priceHistory:[289000,269000,229000,199000],brand:"HomeComfort"},
  {id:12,name:"Parfum Niche Edition",category:"kecantikan",price:599000,originalPrice:799000,rating:4.9,reviews:1234,image:"🌸",trending:true,hot:true,stock:6,sold:387,tags:["limited","hot"],priceHistory:[799000,749000,649000,599000],brand:"LuxeScent"},
];

const CATS=[
  {id:"all",label:"Semua",icon:"🛍️"},
  {id:"elektronik",label:"Elektronik",icon:"📱"},
  {id:"fashion",label:"Fashion",icon:"👗"},
  {id:"kecantikan",label:"Kecantikan",icon:"💅"},
  {id:"rumah",label:"Rumah",icon:"🏠"},
];

const BANNERS=[
  {tag:"FLASH SALE",title:"Diskon Hingga\n70% OFF",sub:"Produk pilihan terbaik hari ini",img:"⚡",cta:"Belanja Sekarang",bg:"linear-gradient(135deg,#0F0F1A,#1A0F2E)",accent:"#D4AF37"},
  {tag:"TRENDING NOW",title:"Top Picks\nMingguan",sub:"Dideteksi AI dari tren pasar global",img:"🔥",cta:"Lihat Trending",bg:"linear-gradient(135deg,#0A1A0A,#0F2A1A)",accent:"#2ECC71"},
  {tag:"NEW ARRIVAL",title:"Koleksi\nTerbaru 2025",sub:"Produk segar langsung dari brand",img:"✨",cta:"Eksplorasi",bg:"linear-gradient(135deg,#1A0A0A,#2A0F0F)",accent:"#E74C3C"},
];

const fmt=n=>"Rp "+n.toLocaleString("id-ID");
const disc=(o,p)=>Math.round(((o-p)/o)*100);

function App(){
  const [cart,setCart]=useState([]);
  const [wish,setWish]=useState([]);
  const [cat,setCat]=useState("all");
  const [search,setSearch]=useState("");
  const [cartOpen,setCartOpen]=useState(false);
  const [detail,setDetail]=useState(null);
  const [bannerIdx,setBannerIdx]=useState(0);
  const [notif,setNotif]=useState(null);
  const [sort,setSort]=useState("trending");
  const [viewMode,setViewMode]=useState("grid");
  const [flash,setFlash]=useState(3*3600+24*60+17);
  const [tab,setTab]=useState("detail");
  const [qty,setQty]=useState(1);
  const [aiOn,setAiOn]=useState(false);
  const [aiRes,setAiRes]=useState(null);
  const [aiLoading,setAiLoading]=useState(false);

  useEffect(()=>{const t=setInterval(()=>setBannerIdx(i=>(i+1)%3),4000);return()=>clearInterval(t)},[]);
  useEffect(()=>{const t=setInterval(()=>setFlash(s=>s>0?s-1:0),1000);return()=>clearInterval(t)},[]);

  const showNotif=(msg,type="success")=>{
    setNotif({msg,type});
    setTimeout(()=>setNotif(null),2500);
  };

  const addCart=(p,q=1)=>{
    setCart(c=>{const ex=c.find(x=>x.id===p.id);
      if(ex)return c.map(x=>x.id===p.id?{...x,qty:x.qty+q}:x);
      return[...c,{...p,qty:q}];
    });
    showNotif(`${p.name} ditambahkan ke keranjang!`);
  };

  const rmCart=id=>setCart(c=>c.filter(x=>x.id!==id));
  const updQty=(id,d)=>setCart(c=>c.map(x=>x.id===id?{...x,qty:Math.max(1,x.qty+d)}:x));
  const togWish=p=>setWish(w=>w.find(x=>x.id===p.id)?w.filter(x=>x.id!==p.id):[...w,p]);

  const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
  const cartCnt=cart.reduce((s,x)=>s+x.qty,0);

  const filtered=PRODUCTS
    .filter(p=>cat==="all"||p.category===cat)
    .filter(p=>p.name.toLowerCase().includes(search.toLowerCase()))
    .sort((a,b)=>{
      if(sort==="trending")return(b.trending?1:0)-(a.trending?1:0);
      if(sort==="price-asc")return a.price-b.price;
      if(sort==="price-desc")return b.price-a.price;
      if(sort==="rating")return b.rating-a.rating;
      if(sort==="sold")return b.sold-a.sold;
      return 0;
    });

  const runAi=()=>{
    setAiOn(true);setAiLoading(true);setAiRes(null);
    setTimeout(()=>{
      setAiRes({
        trending:["Skincare dengan SPF","Wireless Audio","Smart Wearables","Sustainable Fashion"],
        insights:"AI mendeteksi lonjakan 340% pada kategori elektronik portabel minggu ini. Harga sneaker diprediksi naik 15% bulan depan.",
        bestDeal:PRODUCTS.reduce((a,b)=>disc(a.originalPrice,a.price)>disc(b.originalPrice,b.price)?a:b),
      });
      setAiLoading(false);
    },2000);
  };

  const fmtT=s=>{
    const h=Math.floor(s/3600).toString().padStart(2,"0");
    const m=Math.floor((s%3600)/60).toString().padStart(2,"0");
    const sc=(s%60).toString().padStart(2,"0");
    return{h,m,sc};
  };
  const{h,m,sc}=fmtT(flash);
  const b=BANNERS[bannerIdx];

  const Stars=({r})=>[...Array(5)].map((_,i)=>
    <span key={i} style={{color:i<Math.floor(r)?"#D4AF37":"#333",fontSize:12}}>★</span>
  );

  return(
    <div style={{fontFamily:"'DM Sans',sans-serif",background:"#0A0A0F",minHeight:"100vh",color:"#fff"}}>

      {/* NOTIF */}
      {notif&&<div style={{position:"fixed",top:80,right:20,zIndex:9999,background:notif.type==="success"?"#1A2E1A":"#2E1A1A",border:`1px solid ${notif.type==="success"?"#2ECC71":"#E74C3C"}`,borderRadius:12,padding:"12px 20px",display:"flex",alignItems:"center",gap:10,animation:"fadeIn .3s ease",boxShadow:"0 10px 40px rgba(0,0,0,.5)",maxWidth:320}}>
        <span style={{color:notif.type==="success"?"#2ECC71":"#E74C3C",fontSize:16}}>✓</span>
        <span style={{fontSize:14}}>{notif.msg}</span>
      </div>}

      {/* NAVBAR */}
      <nav style={{position:"sticky",top:0,zIndex:100,background:"rgba(10,10,15,.95)",backdropFilter:"blur(20px)",borderBottom:"1px solid #1A1A2A",padding:"0 20px",height:64,display:"flex",alignItems:"center",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
          <div style={{width:36,height:36,background:"linear-gradient(135deg,#D4AF37,#F5C842)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Syne',sans-serif",fontWeight:800,color:"#0A0A0F",fontSize:18}}>B</div>
          <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:20,letterSpacing:2}}>BEBEN</span>
        </div>
        <div style={{flex:1,maxWidth:440,margin:"0 auto",position:"relative"}}>
          <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:"#555",fontSize:16}}>🔍</span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Cari produk, brand..." style={{width:"100%",background:"#111",border:"1px solid #222",borderRadius:24,padding:"10px 16px 10px 38px",color:"#fff",fontSize:14}} />
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
          <button onClick={runAi} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 14px",border:"1px solid #D4AF3740",borderRadius:20,background:"transparent",color:"#D4AF37",cursor:"pointer",fontSize:13,fontWeight:600,transition:"all .2s",fontFamily:"'DM Sans',sans-serif"}}>⚡ AI Detect</button>
          <button onClick={()=>setCartOpen(true)} style={{position:"relative",background:"none",border:"none",cursor:"pointer",padding:8,fontSize:22}}>
            🛒
            {cartCnt>0&&<span style={{position:"absolute",top:2,right:2,background:"#E74C3C",color:"#fff",fontSize:10,fontWeight:700,borderRadius:"50%",width:18,height:18,display:"flex",alignItems:"center",justifyContent:"center"}}>{cartCnt}</span>}
          </button>
          <div style={{width:36,height:36,background:"#111",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",border:"1px solid #222",cursor:"pointer",fontSize:18}}>👤</div>
        </div>
      </nav>

      {/* HERO */}
      <div style={{background:b.bg,padding:"52px 24px",textAlign:"center",position:"relative",overflow:"hidden",minHeight:290,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",transition:"background .8s ease"}}>
        <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",fontSize:200,opacity:.05,pointerEvents:"none",userSelect:"none"}}>{b.img}</div>
        <div style={{position:"relative",zIndex:1}}>
          <span style={{background:b.accent+"20",border:`1px solid ${b.accent}40`,color:b.accent,fontSize:11,fontWeight:700,padding:"4px 14px",borderRadius:20,letterSpacing:2,textTransform:"uppercase"}}>{b.tag}</span>
          <h1 style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:"clamp(30px,7vw,60px)",marginTop:16,lineHeight:1.1,whiteSpace:"pre-line"}}>{b.title}</h1>
          <p style={{color:"#888",fontSize:15,marginTop:8,marginBottom:24}}>{b.sub}</p>
          <button className="btn-gold" style={{padding:"14px 32px",borderRadius:30,fontSize:15,display:"inline-flex",alignItems:"center",gap:8}}>{b.cta} →</button>
        </div>
        <div style={{position:"absolute",bottom:20,left:"50%",transform:"translateX(-50%)",display:"flex",gap:6}}>
          {BANNERS.map((_,i)=><button key={i} className={`hd${i===bannerIdx?" active":""}`} onClick={()=>setBannerIdx(i)} />)}
        </div>
      </div>

      {/* FLASH SALE */}
      <div style={{background:"linear-gradient(90deg,#1A0A00,#2A1400,#1A0A00)",borderTop:"1px solid #D4AF3720",borderBottom:"1px solid #D4AF3720",padding:"16px 24px",display:"flex",alignItems:"center",justifyContent:"center",gap:20,flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:20,animation:"pulse 1s infinite"}}>🔥</span>
          <span style={{fontFamily:"'Syne',sans-serif",fontWeight:700,color:"#D4AF37",fontSize:15,letterSpacing:1}}>FLASH SALE</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          {[h,m,sc].map((v,i)=>(
            <React.Fragment key={i}>
              <span style={{background:"#1A1A2E",border:"1px solid #2A2A4A",borderRadius:8,padding:"8px 14px",fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:24,color:"#D4AF37",minWidth:52,textAlign:"center"}}>{v}</span>
              {i<2&&<span style={{color:"#D4AF37",fontWeight:700,fontSize:20}}>:</span>}
            </React.Fragment>
          ))}
        </div>
        <span style={{color:"#888",fontSize:13}}>Berakhir segera!</span>
      </div>

      {/* AI PANEL */}
      {aiOn&&<div style={{margin:"24px 24px 0",background:"#0F0F1A",border:"1px solid #D4AF3740",borderRadius:16,padding:24,animation:"fadeIn .3s ease"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <span style={{color:"#D4AF37",fontSize:18}}>⚡</span>
          <span style={{fontFamily:"'Syne',sans-serif",fontWeight:700,color:"#D4AF37",fontSize:15}}>AI TREND DETECTOR</span>
          {aiLoading&&<span style={{fontSize:12,color:"#888",animation:"pulse 1s infinite"}}>Menganalisis pasar...</span>}
        </div>
        {aiLoading?<div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
          {["🔍 Memindai tren...","💰 Cek harga kompetitor...","📊 Analisis demand..."].map(t=>(
            <div key={t} style={{background:"#1A1A2E",borderRadius:8,padding:"8px 16px",fontSize:13,color:"#555"}}>{t}</div>
          ))}
        </div>:aiRes&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:16}}>
          <div>
            <p style={{fontSize:12,color:"#666",marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>Trending Sekarang</p>
            {aiRes.trending.map((t,i)=>(
              <div key={t} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <span style={{color:"#D4AF37",fontSize:12,fontWeight:700}}>#{i+1}</span>
                <span style={{fontSize:13}}>{t}</span>
                <div style={{flex:1,background:"#1A1A2E",borderRadius:2,height:4,overflow:"hidden"}}>
                  <div className="fd" style={{width:`${90-i*15}%`}} />
                </div>
              </div>
            ))}
          </div>
          <div>
            <p style={{fontSize:12,color:"#666",marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>Insight AI</p>
            <p style={{fontSize:13,color:"#aaa",lineHeight:1.7}}>{aiRes.insights}</p>
          </div>
          <div>
            <p style={{fontSize:12,color:"#666",marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>Best Deal Hari Ini</p>
            <div style={{background:"#1A1A2E",borderRadius:10,padding:12,cursor:"pointer"}} onClick={()=>{setDetail(aiRes.bestDeal);setQty(1);setTab("detail")}}>
              <div style={{fontSize:32,marginBottom:4}}>{aiRes.bestDeal.image}</div>
              <p style={{fontSize:13,fontWeight:600,marginBottom:4}}>{aiRes.bestDeal.name}</p>
              <p style={{color:"#D4AF37",fontWeight:700,fontSize:15,marginBottom:4}}>{fmt(aiRes.bestDeal.price)}</p>
              <span style={{background:"#E74C3C",color:"#fff",fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:20}}>-{disc(aiRes.bestDeal.originalPrice,aiRes.bestDeal.price)}%</span>
            </div>
          </div>
        </div>}
      </div>}

      {/* STATS */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:1,background:"#1A1A2A",margin:"24px 24px 0",borderRadius:16,overflow:"hidden"}}>
        {[["🚚","Gratis Ongkir","Min. Rp50rb"],["🛡️","Garansi","30 hari"],["🔄","Retur","7 hari"],["🏆","Original","100% terjamin"]].map(([ic,lb,sb])=>(
          <div key={lb} style={{background:"#0F0F1A",padding:"14px 8px",display:"flex",flexDirection:"column",alignItems:"center",gap:6,textAlign:"center"}}>
            <span style={{fontSize:18}}>{ic}</span>
            <span style={{fontSize:12,fontWeight:600}}>{lb}</span>
            <span style={{fontSize:11,color:"#555"}}>{sb}</span>
          </div>
        ))}
      </div>

      {/* CONTENT */}
      <div style={{padding:24,maxWidth:1200,margin:"0 auto"}}>
        {/* CATS */}
        <div style={{display:"flex",gap:10,overflowX:"auto",paddingBottom:8,marginBottom:24,scrollbarWidth:"none"}}>
          {CATS.map(c=>(
            <button key={c.id} className={`cat-btn${cat===c.id?" active":""}`} onClick={()=>setCat(c.id)} style={{padding:"10px 20px",borderRadius:30,fontSize:13,fontWeight:600,display:"flex",alignItems:"center",gap:8,whiteSpace:"nowrap",flexShrink:0}}>
              <span>{c.icon}</span>{c.label}
            </button>
          ))}
        </div>

        {/* TOOLBAR */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20,flexWrap:"wrap",gap:10}}>
          <span style={{fontSize:14,color:"#888"}}>📦 {filtered.length} produk</span>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <select value={sort} onChange={e=>setSort(e.target.value)} className="sort-sel" style={{fontSize:13}}>
              <option value="trending">🔥 Trending</option>
              <option value="sold">📦 Terlaris</option>
              <option value="rating">⭐ Rating</option>
              <option value="price-asc">💰 Termurah</option>
              <option value="price-desc">💎 Termahal</option>
            </select>
            <button onClick={()=>setViewMode(v=>v==="grid"?"list":"grid")} style={{background:"#111",border:"1px solid #222",borderRadius:8,padding:"8px 10px",cursor:"pointer",color:"#888",fontSize:16}}>{viewMode==="grid"?"☰":"⊞"}</button>
          </div>
        </div>

        {/* PRODUCTS */}
        <div style={{display:"grid",gridTemplateColumns:viewMode==="grid"?"repeat(auto-fill,minmax(210px,1fr))":"1fr",gap:16}}>
          {filtered.map(p=>(
            <div key={p.id} className="pc" style={{background:"#0F0F1A",border:"1px solid #1A1A2A",borderRadius:16,overflow:"hidden",cursor:"pointer",display:viewMode==="list"?"flex":"block",alignItems:"center"}} onClick={()=>{setDetail(p);setQty(1);setTab("detail")}}>
              <div style={{background:"linear-gradient(135deg,#1A1A2A,#0F0F1A)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:viewMode==="list"?48:64,padding:viewMode==="list"?"16px 24px":"24px",position:"relative",flexShrink:0,minWidth:viewMode==="list"?100:0}}>
                {p.image}
                <div style={{position:"absolute",top:8,left:8,display:"flex",flexDirection:"column",gap:4}}>
                  {p.trending&&<span className="tag" style={{background:"#D4AF3720",color:"#D4AF37",border:"1px solid #D4AF3740"}}>🔥 Trend</span>}
                  {p.hot&&<span className="tag" style={{background:"#E74C3C20",color:"#E74C3C",border:"1px solid #E74C3C40"}}>⚡ HOT</span>}
                  {p.stock<10&&<span className="tag" style={{background:"#9B59B620",color:"#9B59B6",border:"1px solid #9B59B640"}}>Limited</span>}
                </div>
                <button onClick={e=>{e.stopPropagation();togWish(p)}} style={{position:"absolute",top:8,right:8,background:"#0F0F1A",border:"1px solid #1A1A2A",borderRadius:"50%",width:30,height:30,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:14}}>
                  {wish.find(x=>x.id===p.id)?"❤️":"🤍"}
                </button>
              </div>
              <div style={{padding:"12px 14px 14px",flex:1}}>
                <p style={{fontSize:11,color:"#555",marginBottom:3}}>{p.brand}</p>
                <h3 style={{fontSize:14,fontWeight:600,lineHeight:1.4,marginBottom:7}}>{p.name}</h3>
                <div style={{display:"flex",alignItems:"center",gap:3,marginBottom:7}}>
                  <Stars r={p.rating}/>
                  <span style={{fontSize:11,color:"#666"}}>{p.rating} ({p.reviews.toLocaleString()})</span>
                </div>
                <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:8}}>
                  <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:16}}>{fmt(p.price)}</span>
                  <span style={{fontSize:12,color:"#555",textDecoration:"line-through"}}>{fmt(p.originalPrice)}</span>
                </div>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                  <div style={{display:"flex",gap:6,alignItems:"center"}}>
                    <span style={{background:"#E74C3C",color:"#fff",fontSize:11,fontWeight:700,padding:"2px 7px",borderRadius:20}}>-{disc(p.originalPrice,p.price)}%</span>
                    <span style={{fontSize:11,color:"#555"}}>{p.sold.toLocaleString()} terjual</span>
                  </div>
                  <button className="btn-gold" onClick={e=>{e.stopPropagation();addCart(p)}} style={{padding:"6px 12px",borderRadius:20,fontSize:12}}>+ Keranjang</button>
                </div>
              </div>
            </div>
          ))}
        </div>

        {filtered.length===0&&<div style={{textAlign:"center",padding:80,color:"#444"}}>
          <div style={{fontSize:48,marginBottom:16,opacity:.3}}>📦</div>
          <p style={{fontSize:16}}>Produk tidak ditemukan</p>
        </div>}
      </div>

      {/* FOOTER */}
      <footer style={{background:"#060609",borderTop:"1px solid #1A1A2A",padding:"40px 24px 20px",marginTop:40}}>
        <div style={{maxWidth:1200,margin:"0 auto"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:32,marginBottom:32}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                <div style={{width:32,height:32,background:"linear-gradient(135deg,#D4AF37,#F5C842)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Syne'",fontWeight:800,color:"#0A0A0F",fontSize:16}}>B</div>
                <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18,letterSpacing:2}}>BEBEN</span>
              </div>
              <p style={{fontSize:13,color:"#555",lineHeight:1.7}}>Platform belanja cerdas dengan AI untuk menemukan produk terbaik dan harga terbersaing.</p>
            </div>
            {[["Belanja",["Flash Sale","Trending","Brand Official","Semua Produk"]],["Layanan",["Bantuan","Retur & Refund","Lacak Pesanan","Garansi"]],["Perusahaan",["Tentang Kami","Karier","Press","Kebijakan Privasi"]]].map(([title,links])=>(
              <div key={title}>
                <h4 style={{fontWeight:700,fontSize:14,marginBottom:12,color:"#D4AF37"}}>{title}</h4>
                {links.map(l=><p key={l} className="nav-lnk" style={{fontSize:13,color:"#555",marginBottom:8}}>{l}</p>)}
              </div>
            ))}
          </div>
          <div style={{borderTop:"1px solid #1A1A2A",paddingTop:20,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
            <p style={{fontSize:12,color:"#444"}}>© 2025 BEBEN. All rights reserved.</p>
            <p style={{fontSize:12,color:"#333"}}>Powered by AI Trend Intelligence ⚡</p>
          </div>
        </div>
      </footer>

      {/* CART SIDEBAR */}
      {cartOpen&&<div style={{position:"fixed",inset:0,zIndex:200}}>
        <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.7)",backdropFilter:"blur(4px)"}} onClick={()=>setCartOpen(false)} />
        <div style={{position:"absolute",right:0,top:0,bottom:0,width:"min(420px,100vw)",background:"#0F0F1A",borderLeft:"1px solid #1A1A2A",display:"flex",flexDirection:"column",animation:"slideIn .3s ease"}}>
          <div style={{padding:"20px 24px",borderBottom:"1px solid #1A1A2A",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontSize:20}}>🛒</span>
              <span style={{fontFamily:"'Syne'",fontWeight:700,fontSize:18}}>Keranjang</span>
              {cartCnt>0&&<span style={{background:"#D4AF37",color:"#0A0A0F",fontSize:12,fontWeight:700,padding:"2px 8px",borderRadius:20}}>{cartCnt}</span>}
            </div>
            <button onClick={()=>setCartOpen(false)} style={{background:"#111",border:"1px solid #222",borderRadius:8,padding:"6px 10px",cursor:"pointer",color:"#888",fontSize:18}}>✕</button>
          </div>
          <div style={{flex:1,overflowY:"auto",padding:"16px 24px"}}>
            {cart.length===0?<div style={{textAlign:"center",padding:60,color:"#444"}}>
              <div style={{fontSize:40,marginBottom:12,opacity:.3}}>🛒</div>
              <p>Keranjang masih kosong</p>
            </div>:cart.map(item=>(
              <div key={item.id} style={{display:"flex",gap:12,padding:"14px 0",borderBottom:"1px solid #1A1A2A",animation:"fadeIn .3s ease"}}>
                <div style={{width:60,height:60,background:"#1A1A2A",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,flexShrink:0}}>{item.image}</div>
                <div style={{flex:1,minWidth:0}}>
                  <p style={{fontSize:13,fontWeight:600,marginBottom:4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.name}</p>
                  <p style={{color:"#D4AF37",fontWeight:700,fontSize:14,marginBottom:8}}>{fmt(item.price)}</p>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <button onClick={()=>updQty(item.id,-1)} style={{width:26,height:26,background:"#1A1A2A",border:"none",borderRadius:6,color:"#fff",cursor:"pointer",fontSize:14}}>−</button>
                    <span style={{fontSize:14,fontWeight:600,minWidth:24,textAlign:"center"}}>{item.qty}</span>
                    <button onClick={()=>updQty(item.id,1)} style={{width:26,height:26,background:"#1A1A2A",border:"none",borderRadius:6,color:"#fff",cursor:"pointer",fontSize:14}}>+</button>
                    <button onClick={()=>rmCart(item.id)} style={{marginLeft:"auto",background:"none",border:"none",cursor:"pointer",color:"#E74C3C",fontSize:16}}>🗑</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
          {cart.length>0&&<div style={{padding:"20px 24px",borderTop:"1px solid #1A1A2A"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
              <span style={{color:"#888",fontSize:14}}>Subtotal</span>
              <span style={{fontWeight:600}}>{fmt(total)}</span>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}>
              <span style={{color:"#888",fontSize:14}}>Ongkos Kirim</span>
              <span style={{color:"#2ECC71",fontWeight:600}}>GRATIS</span>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:20,paddingTop:12,borderTop:"1px solid #1A1A2A"}}>
              <span style={{fontWeight:700,fontSize:16}}>Total</span>
              <span style={{fontFamily:"'Syne'",fontWeight:800,fontSize:20,color:"#D4AF37"}}>{fmt(total)}</span>
            </div>
            <button className="btn-gold" style={{width:"100%",padding:16,borderRadius:12,fontSize:16}} onClick={()=>{showNotif("Pesanan berhasil dibuat! 🎉");setCartOpen(false)}}>
              Bayar Sekarang →
            </button>
          </div>}
        </div>
      </div>}

      {/* DETAIL MODAL */}
      {detail&&<div style={{position:"fixed",inset:0,zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16,background:"rgba(0,0,0,.8)",backdropFilter:"blur(8px)",animation:"fadeIn .2s ease"}} onClick={e=>e.target===e.currentTarget&&setDetail(null)}>
        <div style={{background:"#0F0F1A",borderRadius:20,width:"100%",maxWidth:700,maxHeight:"90vh",overflowY:"auto",border:"1px solid #1A1A2A"}}>
          <div style={{display:"flex",flexWrap:"wrap"}}>
            <div style={{flex:"1 1 250px",background:"linear-gradient(135deg,#1A1A2A,#0F0F1A)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:100,minHeight:250,position:"relative"}}>
              {detail.image}
              <button onClick={()=>setDetail(null)} style={{position:"absolute",top:12,right:12,background:"#0F0F1A",border:"1px solid #1A1A2A",borderRadius:8,padding:"6px 10px",cursor:"pointer",color:"#888",fontSize:16}}>✕</button>
            </div>
            <div style={{flex:"1 1 260px",padding:24}}>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
                {detail.trending&&<span className="tag" style={{background:"#D4AF3720",color:"#D4AF37",border:"1px solid #D4AF3740"}}>🔥 Trending</span>}
                {detail.hot&&<span className="tag" style={{background:"#E74C3C20",color:"#E74C3C",border:"1px solid #E74C3C40"}}>⚡ HOT</span>}
              </div>
              <p style={{fontSize:12,color:"#555",marginBottom:4}}>{detail.brand}</p>
              <h2 style={{fontFamily:"'Syne'",fontWeight:700,fontSize:20,lineHeight:1.3,marginBottom:10}}>{detail.name}</h2>
              <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:14}}>
                <Stars r={detail.rating}/>
                <span style={{fontSize:12,color:"#888"}}>{detail.rating} · {detail.reviews.toLocaleString()} ulasan · {detail.sold.toLocaleString()} terjual</span>
              </div>
              <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:6}}>
                <span style={{fontFamily:"'Syne'",fontWeight:800,fontSize:26}}>{fmt(detail.price)}</span>
                <span style={{background:"#E74C3C",color:"#fff",fontSize:12,fontWeight:700,padding:"2px 8px",borderRadius:20}}>-{disc(detail.originalPrice,detail.price)}%</span>
              </div>
              <p style={{fontSize:13,color:"#555",textDecoration:"line-through",marginBottom:16}}>{fmt(detail.originalPrice)}</p>

              {/* TABS */}
              <div style={{display:"flex",gap:4,marginBottom:16,background:"#0A0A0F",borderRadius:10,padding:4}}>
                {["detail","harga","ulasan"].map(t=>(
                  <button key={t} className={`tab-btn${tab===t?" active":""}`} onClick={()=>setTab(t)} style={{flex:1,textTransform:"capitalize"}}>{t}</button>
                ))}
              </div>

              {tab==="detail"&&<div style={{fontSize:13,color:"#888",lineHeight:1.8,marginBottom:16}}>
                <p>✅ Stok: <strong style={{color:"#2ECC71"}}>{detail.stock} unit tersedia</strong></p>
                <p>📦 Estimasi tiba: <strong style={{color:"#fff"}}>2-3 hari kerja</strong></p>
                <p>🛡️ Garansi: <strong style={{color:"#fff"}}>30 hari pengembalian</strong></p>
                <p>🏷️ Kategori: <strong style={{color:"#fff",textTransform:"capitalize"}}>{detail.category}</strong></p>
              </div>}

              {tab==="harga"&&<div style={{marginBottom:16}}>
                <p style={{fontSize:12,color:"#666",marginBottom:12}}>Riwayat harga 4 minggu terakhir:</p>
                {detail.priceHistory.map((ph,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                    <span style={{fontSize:11,color:"#555",width:40}}>W-{3-i}</span>
                    <div style={{flex:1,background:"#1A1A2A",borderRadius:4,height:7,overflow:"hidden"}}>
                      <div className="fd" style={{width:`${(ph/detail.priceHistory[0])*100}%`,background:i===3?"linear-gradient(90deg,#2ECC71,#27AE60)":"linear-gradient(90deg,#D4AF37,#F5C842)"}} />
                    </div>
                    <span style={{fontSize:12,color:i===3?"#2ECC71":"#888",fontWeight:i===3?700:400,width:90,textAlign:"right"}}>{fmt(ph)}</span>
                  </div>
                ))}
                <p style={{fontSize:12,color:"#2ECC71",marginTop:8}}>✅ Harga sekarang terendah!</p>
              </div>}

              {tab==="ulasan"&&<div style={{marginBottom:16}}>
                {[["★★★★★","Produk keren banget! Sesuai deskripsi.","Budi S.","2 hari lalu"],["★★★★★","Pengiriman cepat, packing aman.","Sari M.","1 minggu lalu"],["★★★★☆","Bagus, tapi warna sedikit berbeda.","Ahmad R.","2 minggu lalu"]].map(([stars,text,name,time])=>(
                  <div key={name} style={{borderBottom:"1px solid #1A1A2A",paddingBottom:10,marginBottom:10}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                      <span style={{color:"#D4AF37"}}>{stars}</span>
                      <span style={{fontSize:11,color:"#555"}}>{time}</span>
                    </div>
                    <p style={{fontSize:13,color:"#aaa",marginBottom:2}}>{text}</p>
                    <p style={{fontSize:11,color:"#555"}}>— {name}</p>
                  </div>
                ))}
              </div>}

              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
                <div style={{display:"flex",alignItems:"center",background:"#0A0A0F",borderRadius:10,overflow:"hidden",border:"1px solid #1A1A2A"}}>
                  <button onClick={()=>setQty(q=>Math.max(1,q-1))} style={{padding:"10px 14px",background:"none",border:"none",cursor:"pointer",color:"#fff",fontSize:16}}>−</button>
                  <span style={{padding:"10px 16px",fontWeight:700,fontSize:16}}>{qty}</span>
                  <button onClick={()=>setQty(q=>q+1)} style={{padding:"10px 14px",background:"none",border:"none",cursor:"pointer",color:"#fff",fontSize:16}}>+</button>
                </div>
                <button onClick={()=>togWish(detail)} style={{padding:"10px 14px",background:"#0A0A0F",border:"1px solid #1A1A2A",borderRadius:10,cursor:"pointer",fontSize:18}}>
                  {wish.find(x=>x.id===detail.id)?"❤️":"🤍"}
                </button>
              </div>

              <button className="btn-gold" style={{width:"100%",padding:14,borderRadius:12,fontSize:16}} onClick={()=>{addCart(detail,qty);setDetail(null);setCartOpen(true)}}>
                🛒 Tambah ke Keranjang
              </button>
            </div>
          </div>
        </div>
      </div>}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
